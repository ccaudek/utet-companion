project:
  type: book
  output-dir: docs
  resources:
    - _common.R

lang: it

google-scholar: true

book:
  title: "Inferenza bayesiana in psicologia: ragionare con l'incertezza"
  license: "CC BY-NC-ND"

  author:
    - name: "Corrado Caudek"
      orcid: "0000-0002-1404-0420"

  date: last-modified
  date-format: "DD MMMM YYYY"

  site-url: https://ccaudek.github.io/utet-companion/
  repo-url: https://github.com/ccaudek/utet-companion/
  repo-actions: [source, issue]

  reader-mode: true
  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: true

  search:
    location: sidebar
    type: overlay
    copy-button: true
    show-item-context: true

  sidebar:
    collapse-level: 1

  google-analytics:
    tracking-id: "G-QT5S3P9D31"
    anonymize-ip: true

  cookie-consent:
    type: express
    style: headline
    palette: light
    language: it
    prefs-text: "Preferenze cookie"

  open-graph: true
  twitter-card: true

  # Decommentare se il file e disponibile nel progetto.
  # favicon: style/gauss.png

  page-footer:
    left: |
      Modulo del progetto UTET a supporto del manuale *Inferenza bayesiana in psicologia: Ragionare con l'incertezza*.
    right: |
      Realizzato con [Quarto](https://quarto.org/).

  chapters:
    - index.qmd

    - part: "Crisi"
      chapters:
        - chapters/replication_crisis/_intro_sec_crisis.qmd
        - chapters/replication_crisis/01_crisis.qmd

    - part: "Diagnosi"
      chapters:
        - chapters/limits/_intro_sec_limits.qmd
        - chapters/limits/01_limits_stat_freq.qmd
        - chapters/limits/02_effect_size.qmd
        - chapters/limits/03_s_m_errors.qmd
        - chapters/limits/04_p_values.qmd
        - chapters/limits/05_degrees_of_freedom.qmd

    - part: "Svolta"
      chapters:
        - chapters/bayesian_inference/_intro_sec_bayesian.qmd
        - chapters/bayesian_inference/00_epistemological_foundations.qmd
        - chapters/bayesian_inference/01_grid_approx.qmd
        - chapters/bayesian_inference/02_conjugate_families.qmd
        - chapters/bayesian_inference/03_summary_posterior.qmd
        - chapters/bayesian_inference/04_balance_prior_post.qmd
        - chapters/bayesian_inference/05_prior_pred_distr.qmd
        - chapters/bayesian_inference/06_post_pred_distr.qmd
        - chapters/bayesian_inference/07_singolo_paziente.qmd
        - chapters/bayesian_inference/conclusions_sec.qmd

    - part: "Calcolo"
      chapters:
        - chapters/mcmc/_intro_sec_stan.qmd
        - chapters/mcmc/02_ppl.qmd
        - chapters/mcmc/03_stan_intro.qmd
        - chapters/mcmc/04_stan_odds_ratio_stan.qmd
        - chapters/mcmc/05_stan_two_means.qmd
        - chapters/mcmc/12_bayesian_workflow.qmd
        - chapters/mcmc/conclusions_sec.qmd

    - part: "Modelli"
      chapters:
        - chapters/linear_models/_intro_sec_regression.qmd
        - chapters/linear_models/01_regression_questions.qmd
        - chapters/linear_models/02_reglin_bayes.qmd
        - chapters/linear_models/03_regr_toward_mean.qmd
        - chapters/linear_models/04_synt_sugar.qmd
        - chapters/linear_models/05_stan_regression.qmd
        - chapters/linear_models/06_one_mean.qmd
        - chapters/linear_models/07_two_means.qmd
        - chapters/linear_models/08_effect_size.qmd
        - chapters/linear_models/09_anova_1via.qmd
        - chapters/linear_models/10_multilevel.qmd
        - chapters/linear_models/11_meas_error.qmd
        - chapters/linear_models/conclusions_sec.qmd


    - part: "Causalità"
      chapters:
        - chapters/causality/_intro_sec_causality.qmd
        - chapters/causality/01_specification_error.qmd
        - chapters/causality/02_propedeutic_causality.qmd
        - chapters/causality/03_causality.qmd
        - chapters/causality/conclusions_sec.qmd

    - part: "Estensioni"
      chapters:
        - chapters/glm/_intro_sec_glm.qmd
        - chapters/glm/01_logistic_regr.qmd
        - chapters/glm/02_one_proportion.qmd
        - chapters/glm/03_two_proportions.qmd
        - chapters/glm/04_poisson_model.qmd
        - chapters/glm/05_logistic_process.qmd
        - chapters/glm/conclusions_sec.qmd

    - part: "Applicazione"
      chapters:
        - chapters/formal_models/_intro_sec_applications.qmd
        - chapters/formal_models/01_statistical_models.qmd
        - chapters/formal_models/02_goal_revision_model.qmd
        - chapters/formal_models/03_modeling_heterogeneity.qmd
        - chapters/formal_models/04_rescorla_wagner.qmd
        - chapters/formal_models/05_decisione_ottimale.qmd
        - chapters/formal_models/conclusions_sec.qmd

    - part: "Valutazione"
      chapters:
        - chapters/entropy/_intro_sec_entropy.qmd
        - chapters/entropy/01_entropy.qmd
        - chapters/entropy/02_kl.qmd
        - chapters/entropy/03_valutare_modelli_bayesiani.qmd
        - chapters/entropy/conclusions_sec_entropy.qmd

    - part: "Visione"
      chapters:
        - chapters/epilogue/_intro_sec_epilogue.qmd
        - chapters/epilogue/01_changes.qmd
        - chapters/epilogue/02_integrity.qmd
        - chapters/epilogue/03_epilogue.qmd

  appendices:

    # Orientamento
    - chapters/appendix/a00_glossary.qmd
    - chapters/appendix/a60_bayesian_workflow_checklist.qmd

    # Richiami matematici e notazionali
    - chapters/appendix/a11_numbers.qmd
    - chapters/appendix/a12_sum_notation.qmd
    - chapters/appendix/a13_sets.qmd
    - chapters/appendix/a14_combinatorics.qmd
    - chapters/appendix/a15_calculus.qmd
    
    # Ambiente computazionale e Stan
    - chapters/appendix/a40_troubleshooting.qmd
    - chapters/appendix/a41_install_cmdstan.qmd
    - chapters/appendix/a42_cmdstanr_intro.qmd
    - chapters/appendix/a43_stan_lang.qmd
    - chapters/appendix/a44_stan_diagnostics.qmd
    - chapters/appendix/a45_stan_prior-predictive.qmd
    - chapters/appendix/a46_stan_posterior_predictive.qmd

    # Approfondimenti sui modelli
    - chapters/appendix/a50_lin_fun.qmd
    - chapters/appendix/a51_reglin_frequentist.qmd
    - chapters/appendix/a52_regression_likelihood.qmd

crossref:
  appendix-title: "Appendice"

bibliography: references.bib
csl: apa.csl
link-citations: true

format:
  html:
    highlight-style: arrow

    theme:
      light:
        - cosmo
        - style/custom.scss
      dark:
        - darkly
        - style/custom.scss
        - style/custom-dark.scss

    css:
      - style/cards.css

    respect-user-color-scheme: true
    canonical-url: true

    toc: true
    toc-location: right
    toc-depth: 2
    toc-title: "Sommario"
    toc-expand: 2
    smooth-scroll: true
    anchor-sections: true

    code-fold: false
    code-summary: "Mostra/Nascondi codice"
    code-copy: hover
    code-link: true
    code-overflow: wrap
    code-block-bg: true

    fig-responsive: true
    fig-align: center
    fig-cap-location: bottom
    tbl-cap-location: top
    lightbox: auto
    df-print: paged

    footnotes-hover: true
    citations-hover: true
    crossrefs-hover: true

    link-external-icon: true
    link-external-newwindow: true
    link-external-filter: "^(?:https?:)?//ccaudek\\.github\\.io/utet-prob/"

    html-math-method: 
      method: mathjax
      mathjax:
        config: TeX-AMS_CHTML
        options:
          font: "Latin-Modern"


  pdf:
    documentclass: scrbook
    classoption:
      - a4paper
      - 11pt
      - open=any            # i capitoli non iniziano forzatamente a pagina dispari
                            # (evita pagine bianche: sensato per un PDF letto a schermo;
                            # per la stampa tipografica rimuovere questa riga)
    pdf-engine: lualatex    
    mainfont: "Libertinus Serif"   # copertura IAST completa; alternative: "Gentium Plus",
    sansfont: "Libertinus Sans"    # "EB Garamond", "Charis SIL"
    lang: it                # se non è già a livello di progetto: attiva sillabazione
                            # italiana e traduce "Indice", "Capitolo", ecc.
    toc: true
    toc-depth: 2
    number-sections: true

    colorlinks: true
    linkcolor: MidnightBlue    # più sobrio del blu acceso predefinito
    citecolor: MidnightBlue
    urlcolor: MidnightBlue

    geometry:
      - top=25mm
      - bottom=25mm
      - inner=30mm           # con scrbook (twoside) inner/outer è più corretto
      - outer=25mm           # di left/right: il margine interno assorbe la rilegatura

    include-in-header:
      text: |
        \usepackage[automark]{scrlayer-scrpage}  % testatine correnti (capitolo/sezione)
        \clubpenalty=10000                        % niente righe orfane
        \widowpenalty=10000                       % niente righe vedove


execute:
  freeze: auto
  cache: false

  echo: true
  warning: false
  message: false
  error: false

  fig.width: 6.5
  fig.asp: 0.618
  fig.retina: 2
  fig.align: center
  fig.show: hold

  options:
    width: 90
    pillar.width: 90
    tibble.width: 90

