crossref:
  appendix-title: "Appendice"

toc: true
toc-depth: 2

bibliography: ./references.bib
biblio-style: apalike
csl: apa.csl
link-citations: true

google-scholar: true

format:
  html:
    theme: 
      light: cosmo
      dark: darkly
    mainfont: "system-ui"
    page-layout: article
    max-width: 74ch
    number-sections: true
    lang: it
    reader-mode: true
    toc: true
    toc-title: "Sommario"
    toc-expand: 2
    smooth-scroll: true
    footnotes-hover: true
    link-external-icon: true
    link-external-newwindow: true

    # Figure 
    fig-align: center
    fig-responsive: true
    fig-cap-location: bottom
    fig-format: png    
  
    # Matematica
    html-math-method:
      method: mathjax
      # macros: { "\\E": "\\mathbb{E}", "\\Var": "\\mathrm{Var}" }

    # Codice
    code-copy: hover
    code-link: true
    code-overflow: scroll
    code-line-numbers: false
    code-block-bg: true
    code-block-border-left: false
    code-tools: true
    highlight-style: github

    # Media
    lightbox: auto

  # pdf:
  #   documentclass: scrreprt  # impaginazione da libro (KOMA-Script)
  #   classoption: [12pt, oneside]
  #   pdf-engine: xelatex
  #   pdf-engine-opt: "-shell-escape"
  #   number-sections: true
  #   toc: true
  #   toc-depth: 2
  #   fig-align: center
  #   fig-width: 6
  #   fig-height: 4
  #   keep-tex: true


execute:
  freeze: auto  # Skip re-executing unchanged code chunks
  echo: true  # Display code in the output document
  warning: false  # Suppress warnings in output
  message: false  # Suppress messages in output
  fig.width: 6  # Set figure width (in inches)
  fig.asp: 0.618  # Set figure aspect ratio (golden ratio for aesthetics)
  fig.retina: 2  # High resolution for retina displays
  fig.align: "center"  # Center-align all figures
  fig.show: "hold"  # Group multiple figures from a chunk
  options:
    width: 120            # allarga la console virtuale
    pillar.width: Inf      # disattiva il riassunto colonne
    tibble.width: Inf      # idem, per sicurezza

website:
  cookie-consent:
    type: express
    style: headline
    anonymize-ip: true

# Opzionale: assicurati che _common.R sia disponibile ovunque
resources:
  - _common.R
