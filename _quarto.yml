  appendices:
    - chapters/appendix/a01_shell.qmd
    - chapters/appendix/a01a_files.qmd
    - chapters/appendix/a02_math_symbols.qmd
    - chapters/appendix/a03_latex.qmd
    - chapters/appendix/a11_numbers.qmd
    - chapters/appendix/a12_sum_notation.qmd
    - chapters/appendix/a13_sets.qmd
    - chapters/appendix/a14_combinatorics.qmd
    - chapters/appendix/a15_calculus.qmd
    # - chapters/appendix/a35_other_conjugate_families.qmd
    - chapters/appendix/a36_gamma_poisson_model.qmd
    # - chapters/appendix/a40_metropolis_normal.qmd
    - chapters/appendix/a41_install_cmdstan.qmd
    - chapters/appendix/a42_cmdstanr_intro.qmd
    - chapters/appendix/a43_stan_lang.qmd
    - chapters/appendix/a44_stan_diagnostics.qmd
    - chapters/appendix/a45_stan_prior-predictive.qmd
    - chapters/appendix/a46_stan_posterior_predictive.qmd
    - chapters/appendix/a50_lin_fun.qmd
    - chapters/appendix/a52_regression_likelihood.qmd

crossref:
  appendix-title: "Appendice"

bibliography: references.bib
csl: apa.csl
link-citations: true

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css:
      - style/custom.css
      - style/cards.css

    respect-user-color-scheme: true
    canonical-url: true

    toc: true
    toc-depth: 2
    toc-title: "Sommario"
    toc-expand: 2
    smooth-scroll: true
    anchor-sections: true

    code-fold: false
    code-summary: "Mostra/Nascondi codice"
    code-copy: hover
    code-link: true
    code-overflow: scroll
    code-block-bg: true

    fig-responsive: true
    fig-align: center
    fig-cap-location: bottom
    tbl-cap-location: top
    lightbox: auto
    df-print: paged

    footnotes-hover: true
    citations-hover: true
    crossrefs-hover: true

    link-external-icon: true
    link-external-newwindow: true
    link-external-filter: "^(?:https?:)?//ccaudek\\.github\\.io/utet-companion/"

    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
      # macros:
      #   "\\E": "\\mathbb{E}"
      #   "\\Var": "\\mathrm{Var}"
      #   "\\Cov": "\\mathrm{Cov}"

execute:
  freeze: auto
  echo: true
  warning: false
  message: false
  fig.width: 6
  fig.asp: 0.618
  fig.retina: 2
  fig.align: center
  fig.show: hold
  options:
    width: 120
    pillar.width: Inf
    tibble.width: Inf
