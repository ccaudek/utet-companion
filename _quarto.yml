project:
  type: book
  output-dir: docs

lang: it

book:
  title: "Ragionare con l'incertezza"
  subtitle: "Companion digitale del manuale UTET"
  description: |
    Approfondimenti, implementazioni riproducibili e materiali integrativi associati al manuale *Inferenza bayesiana in psicologia: Ragionare con l'incertezza*.
  license: "CC BY-NC-ND 4.0"

  author:
    - name: "Corrado Caudek"
      orcid: "0000-0002-1404-0420"
      affiliation: "Università degli Studi di Firenze"

  date: last-modified
  date-format: "DD MMMM YYYY"

  site-url: https://ccaudek.github.io/utet-companion/
  repo-url: https://github.com/ccaudek/utet-companion/
  repo-actions: [issue]

  reader-mode: true
  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: true

  search:
    location: sidebar
    type: overlay
    copy-button: true
    show-item-context: true

  sidebar:
    collapse-level: 1
    tools:
      - icon: book
        href: guida-al-manuale.qmd
        text: "Guida al manuale"

  google-analytics:
    tracking-id: "G-QT5S3P9D31"
    anonymize-ip: true

  cookie-consent:
    type: express
    style: headline
    palette: light
    language: it
    prefs-text: "Preferenze cookie"

  open-graph: true
  twitter-card: true

  page-footer:
    left: |
      **Companion digitale** del manuale UTET *Inferenza bayesiana in psicologia: Ragionare con l'incertezza*.
    right: |
      Realizzato con [Quarto](https://quarto.org/).

  chapters:
    - index.qmd
    # La legenda dei percorsi e confluita nella pagina stabile seguente.
    # Gli URL storici /percorsi/ e /percorsi.html sono mantenuti come alias.
    - guida-al-manuale.qmd

    - part: "Crisi"
      chapters:
        - chapters/crisi/_intro_sec_crisis.qmd
        - chapters/crisi/01_crisis.qmd
        - chapters/crisi/conclusions_sec_crisis.qmd

    - part: "Diagnosi"
      chapters:
        - chapters/diagnosi/_intro_sec_limits.qmd
        - chapters/diagnosi/01_limits_stat_freq.qmd
        - chapters/diagnosi/02_effect_size.qmd
        - chapters/diagnosi/03_s_m_errors.qmd
        - chapters/diagnosi/04_p_values.qmd
        - chapters/diagnosi/05_degrees_of_freedom.qmd
        - chapters/diagnosi/conclusions_sec_limits.qmd


    - part: "Svolta"
      chapters:
        - chapters/svolta/_intro_sec_bayesian.qmd
        - chapters/svolta/00_epistemological_foundations.qmd
        - chapters/svolta/01_grid_approx.qmd
        - chapters/svolta/02_conjugate_families.qmd
        - chapters/svolta/03_summary_posterior.qmd
        - chapters/svolta/04_balance_prior_post.qmd
        - chapters/svolta/05_prior_pred_distr.qmd
        - chapters/svolta/06_post_pred_distr.qmd
        - chapters/svolta/07_singolo_paziente.qmd
        - chapters/svolta/conclusions_sec_bayesian.qmd

    - part: "Calcolo"
      chapters:
        - chapters/calcolo/_intro_sec_stan.qmd
        - chapters/calcolo/01_metropolis.qmd
        - chapters/calcolo/02_ppl.qmd
        - chapters/calcolo/03_stan_intro.qmd
        - chapters/calcolo/04_stan_odds_ratio_stan.qmd
        - chapters/calcolo/05_stan_two_means.qmd
        - chapters/calcolo/06_bayesian_workflow.qmd
        - chapters/calcolo/conclusions_sec.qmd

    - part: "Modelli"
      chapters:
        - chapters/modelli/_intro_sec_regression.qmd
        - chapters/modelli/01_modello_lineare_generativo.qmd
        - chapters/modelli/02_regressione_verso_media.qmd
        - chapters/modelli/03_regressione_bayesiana_brms.qmd
        - chapters/modelli/04_dalla_formula_al_programma.qmd
        - chapters/modelli/05_inferenza_su_una_media.qmd
        - chapters/modelli/06_due_gruppi_rilevanza_pratica.qmd
        - chapters/modelli/07_piu_gruppi_contrasti_anova.qmd
        - chapters/modelli/08_modelli_multilivello_partial_pooling.qmd
        - chapters/modelli/09_quando_il_modello_sbaglia.qmd
        - chapters/modelli/10_associazione_previsione_effetto_causale.qmd
        - chapters/modelli/conclusions_sec_regression.qmd
        
    - part: "Causalità"
      chapters:
        - chapters/causalita/_intro_sec_causality.qmd
        - chapters/causalita/01_specification_error.qmd
        - chapters/causalita/02_propedeutic_causality.qmd
        - chapters/causalita/03_causality.qmd
        - chapters/causalita/conclusions_sec_causality.qmd

    - part: "Estensioni"
      chapters:
        - chapters/estensioni/_intro_sec_glm.qmd
        - chapters/estensioni/01_regressione_logistica.qmd
        - chapters/estensioni/02_proporzioni.qmd
        - chapters/estensioni/03_modelli_conteggio.qmd
        - chapters/estensioni/04_dal_glm_al_modello_processuale.qmd
        - chapters/estensioni/conclusions_sec_glm.qmd

    - part: "Applicazione"
      chapters:
        - chapters/applicazione/_intro_sec_applications.qmd
        - chapters/applicazione/01_dalla_descrizione_alla_spiegazione.qmd
        - chapters/applicazione/02_costruire_modello_dinamico.qmd
        - chapters/applicazione/03_rescorla_wagner.qmd
        - chapters/applicazione/04_eterogeneita_modelli_dinamici.qmd
        - chapters/applicazione/05_decisione_ottimale.qmd
        - chapters/applicazione/conclusions_sec_applications.qmd

    - part: "Valutazione"
      chapters:
        - chapters/valutazione/_intro_sec_entropy.qmd
        - chapters/valutazione/01_entropy.qmd
        - chapters/valutazione/02_kl.qmd
        - chapters/valutazione/03_valutare_modelli_bayesiani.qmd
        - chapters/valutazione/04_generalizzazione.qmd
        - chapters/valutazione/conclusions_sec_entropy.qmd

    - part: "Visione"
      chapters:
        - chapters/visione/_intro_sec_epilogue.qmd
        - chapters/visione/01_changes.qmd
        - chapters/visione/02_integrity.qmd
        - chapters/visione/03_epilogue.qmd

  appendices:

    - part: "Orientamento"
      chapters:
        - chapters/appendix/a00_glossary.qmd
        - chapters/appendix/a60_bayesian_workflow_checklist.qmd

    - part: "Richiami matematici e notazionali"
      chapters:
        - chapters/appendix/a11_numbers.qmd
        - chapters/appendix/a12_sum_notation.qmd
        - chapters/appendix/a13_sets.qmd
        - chapters/appendix/a14_combinatorics.qmd
        - chapters/appendix/a15_calculus.qmd
    
    - part: "Ambiente computazionale e Stan"
      chapters:
        - chapters/appendix/a40_troubleshooting.qmd
        - chapters/appendix/a41_install_cmdstan.qmd
        - chapters/appendix/a42_cmdstanr_intro.qmd
        - chapters/appendix/a43_stan_lang.qmd
        - chapters/appendix/a44_stan_diagnostics.qmd
        - chapters/appendix/a45_stan_prior-predictive.qmd
        - chapters/appendix/a46_stan_posterior_predictive.qmd

    - part: "Approfondimenti sui modelli"
      chapters:
        - chapters/appendix/a50_lin_fun.qmd
        - chapters/appendix/a51_matrix_algebra.qmd
        - chapters/appendix/a52_reglin_frequentist.qmd
        - chapters/appendix/a53_regression_likelihood.qmd
        - chapters/appendix/a54_errore_misurazione_varianza_metodo.qmd

crossref:
  appendix-title: "Appendice"

bibliography: references.bib
csl: apa.csl
link-citations: true

format:
  html:
    highlight-style: arrow

    theme:
      light:
        - cosmo
        - style/custom.scss
        - style/companion.scss
      dark:
        - darkly
        - style/custom.scss
        - style/custom-dark.scss
        - style/companion.scss

    respect-user-color-scheme: true
    canonical-url: true

    toc: true
    toc-location: right
    toc-depth: 2
    toc-title: "Sommario"
    toc-expand: 2
    smooth-scroll: true
    anchor-sections: true

    code-fold: show
    code-summary: "Mostra/Nascondi codice"

    code-tools:
      source: false
      toggle: true
      caption: "Codice"

    code-copy: hover
    code-link: true
    code-overflow: wrap
    code-block-bg: true

    fig-responsive: true
    fig-align: center
    fig-cap-location: bottom
    tbl-cap-location: top
    lightbox: auto
    df-print: paged

    footnotes-hover: true
    citations-hover: true
    crossrefs-hover: true

    link-external-icon: true
    link-external-newwindow: true
    link-external-filter: "^(?:https?:)?//ccaudek\\.github\\.io/"

    html-math-method: 
      method: mathjax
      mathjax:
        config: TeX-AMS_CHTML
        options:
          font: "Latin-Modern"


  pdf:
    documentclass: scrbook
    classoption:
      - a4paper
      - 12pt
      - open=right
      - numbers=noenddot

    pdf-engine: lualatex

    # Tipografia
    mainfont: "Palatino"
    sansfont: "Libertinus Sans"
    monofont: "Source Code Pro"
    mathfont: "TeX Gyre Pagella Math"

    sansfontoptions:
      - Scale=MatchLowercase
    monofontoptions:
      - Scale=MatchLowercase

    linestretch: 1.05

    # Struttura del volume
    toc: true
    toc-depth: 2
    number-sections: true

    # Bibliografia distinta alla fine di ciascun capitolo.
    filters:
      - quarto
      - pandoc-ext/section-bibliographies
    citeproc: false
    reference-section-title: "Riferimenti bibliografici"

    # Collegamenti
    colorlinks: true
    linkcolor: MidnightBlue
    citecolor: MidnightBlue
    urlcolor: MidnightBlue

    # Codice, figure e tabelle
    highlight-style: github
    code-overflow: wrap
    fig-align: center
    fig-cap-location: bottom
    tbl-cap-location: top

    # Geometria della pagina
    geometry:
      - top=25mm
      - bottom=26mm
      - inner=31mm
      - outer=24mm
      - headsep=8mm
      - footskip=12mm
      - heightrounded

    include-in-header:
      text: |
        % ==========================================================
        % 1. Microtipografia e impostazione del paragrafo
        % ==========================================================
        \usepackage{microtype}
        \microtypesetup{
          protrusion=true,
          expansion=true,
          tracking=true
        }

        \emergencystretch=2em
        \setlength{\parindent}{1.25em}
        \setlength{\parskip}{0pt plus 0.5pt}

        % L'interlinea è impostata mediante `linestretch: 1.05`
        % nella configurazione Quarto.

        % ==========================================================
        % 2. Palette editoriale
        % ==========================================================
        \definecolor{BookAccent}{HTML}{243B53}       % blu editoriale sobrio
        \definecolor{BookAccentLight}{HTML}{C9D4E0}  % numeri di capitolo e filetti chiari
        \definecolor{BookGrey}{HTML}{5A6572}         % elementi secondari

        % ==========================================================
        % 3. Testatine e piè di pagina
        % ==========================================================
        \usepackage[
          automark,
          headsepline=0.4pt
        ]{scrlayer-scrpage}

        \clearpairofpagestyles
        \automark[section]{chapter}

        \ihead[]{\headmark}
        \ohead[]{\pagemark}
        \cfoot[\pagemark]{}

        \setkomafont{pageheadfoot}{%
          \footnotesize\sffamily\color{BookGrey}%
        }
        \setkomafont{pagenumber}{%
          \footnotesize\sffamily\bfseries\color{BookAccent}%
        }
        \addtokomafont{headsepline}{\color{BookAccentLight}}

        % ==========================================================
        % 4. Aperture di capitolo
        %    Numero grande in tinta chiara allineato a destra,
        %    filetto pieno e titolo ampio.
        % ==========================================================
        \RedeclareSectionCommand[
          beforeskip=1\baselineskip,
          afterskip=2\baselineskip,
          tocbeforeskip=1.1\baselineskip
        ]{chapter}

        \setkomafont{disposition}{%
          \normalfont\sffamily\bfseries
        }
        \setkomafont{chapter}{%
          \normalfont\sffamily\bfseries\Huge\color{BookAccent}
        }

        \renewcommand*{\chapterformat}{%
          {\normalfont\sffamily\bfseries
           \fontsize{58}{58}\selectfont
           \color{BookAccentLight}\thechapter}%
        }

        \renewcommand{\chapterlinesformat}[3]{%
          \Ifstr{#2}{}{%
            % Capitoli non numerati:
            % Prefazione, Introduzione, Conclusioni, ecc.
            {\raggedright #3\par}\nobreak
            \vskip 0.5\baselineskip
            {\color{BookAccent}\rule{\textwidth}{0.9pt}}\par
          }{%
            % Capitoli numerati
            {\raggedleft #2\par}\nobreak
            \vskip 0.4\baselineskip
            {\color{BookAccent}\rule{\textwidth}{0.9pt}}\par\nobreak
            \vskip 1\baselineskip
            {\raggedright #3\par}%
          }%
        }

        % ==========================================================
        % 5. Gerarchia dei titoli interni
        % ==========================================================
        \setkomafont{section}{%
          \normalfont\sffamily\bfseries\Large\color{BookAccent}
        }
        \setkomafont{subsection}{%
          \normalfont\sffamily\bfseries\large
        }
        \setkomafont{subsubsection}{%
          \normalfont\sffamily\bfseries\normalsize\color{BookGrey}
        }

        \RedeclareSectionCommands[
          beforeskip=1.6\baselineskip,
          afterskip=0.8\baselineskip
        ]{section}

        \RedeclareSectionCommands[
          beforeskip=1.3\baselineskip,
          afterskip=0.6\baselineskip
        ]{subsection,subsubsection}

        % ==========================================================
        % 6. Frontespizi di parte
        % ==========================================================
        \setkomafont{part}{%
          \normalfont\sffamily\bfseries\Huge\color{BookAccent}
        }
        \setkomafont{partnumber}{%
          \normalfont\sffamily\mdseries\huge\color{BookGrey}
        }

        % ==========================================================
        % 7. Sommario
        % ==========================================================
        \setkomafont{partentry}{%
          \sffamily\bfseries\large\color{BookAccent}
        }
        \setkomafont{chapterentry}{%
          \sffamily\bfseries
        }
        \setkomafont{chapterentrypagenumber}{%
          \sffamily\bfseries
        }

        % ==========================================================
        % 8. Didascalie e tabelle
        % ==========================================================
        \setkomafont{caption}{\small}
        \setkomafont{captionlabel}{%
          \small\sffamily\bfseries\color{BookAccent}
        }
        \setcapindent{0pt}

        \usepackage{booktabs}
        \usepackage{array}

        % ==========================================================
        % 9. Note a piè di pagina e descrizioni
        % ==========================================================
        \setkomafont{footnote}{\small}
        \deffootnote{1.4em}{1em}{%
          \textsuperscript{\thefootnotemark}\,
        }

        \setkomafont{descriptionlabel}{%
          \sffamily\bfseries
        }

        % ==========================================================
        % 10. Spaziatura attorno a figure e tabelle
        %     Valori calibrati per il corpo a 12 pt.
        % ==========================================================
        \setlength{\textfloatsep}{20pt plus 4pt minus 3pt}
        \setlength{\floatsep}{16pt plus 3pt minus 2pt}
        \setlength{\intextsep}{16pt plus 3pt minus 2pt}

        % ==========================================================
        % 11. Elenchi
        % ==========================================================
        \usepackage{enumitem}

        \setlist{
          itemsep=0.25em,
          topsep=0.5em,
          parsep=0pt,
          partopsep=0pt
        }

        % ==========================================================
        % 12. Controllo di vedove, orfane e salti di pagina
        %     Controllo forte, ma non assoluto, per evitare pagine
        %     eccessivamente vuote o spaziature verticali irregolari.
        % ==========================================================
        \clubpenalty=9000
        \widowpenalty=9000
        \displaywidowpenalty=10000
        \brokenpenalty=5000

        % ==========================================================
        % 13. Codice sorgente e output della console
        %     Corpo ridotto e ritorno a capo automatico.
        % ==========================================================
        \usepackage{fvextra}

        % Codice sorgente con evidenziazione sintattica
        \RecustomVerbatimEnvironment{Highlighting}{Verbatim}{
          commandchars=\\\{\},
          fontsize=\footnotesize,
          breaklines=true,
          breakanywhere=true,
          breakautoindent=true,
          breaksymbolleft={\tiny\ensuremath{\hookrightarrow}\,}
        }

        % Output testuale prodotto da R/knitr
        \RecustomVerbatimEnvironment{verbatim}{Verbatim}{
          fontsize=\footnotesize,
          breaklines=true,
          breakanywhere=true,
          breakautoindent=true,
          breaksymbolleft={\tiny\ensuremath{\hookrightarrow}\,}
        }

editor: source

execute:
  freeze: auto
  cache: false

  echo: true
  warning: false
  message: false
  error: false

  fig.width: 6.5
  fig.asp: 0.618
  fig.retina: 2
  fig.align: center
  fig.show: hold

  options:
    width: 90
    pillar.width: 90
    tibble.width: 90

