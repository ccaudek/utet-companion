crossref:
  appendix-title: "Appendice"

toc: true
toc-depth: 2

bibliography: ./references.bib
biblio-style: apalike
csl: apa.csl
link-citations: true

google-scholar: true

format:
  html:
    # -------- Codice --------
    code-fold: false
    code-summary: "Mostra/Nascondi codice"
    code-copy: hover
    code-link: true
    code-overflow: scroll
    code-block-bg: true
    
    # -------- Tema --------
    theme:
      light: 
        - cosmo
      dark: 
        - darkly
    css: 
      - style/custom.css
      - style/cards.css

    mainfont: "system-ui"
    lang: it
    
    # -------- Navigazione --------
    reader-mode: true
    toc: true              # TOC va qui sotto format:html:
    toc-depth: 2           # E anche toc-depth
    toc-title: "Sommario"
    smooth-scroll: true
    
    # -------- Link e note --------
    footnotes-hover: true
    link-external-icon: true
    link-external-newwindow: true
    
    # -------- Media --------
    lightbox: auto
    
    # -------- Matematica --------
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
      # Macro opzionali (decommentare se serve)
      # macros:
      #   "\\E": "\\mathbb{E}"
      #   "\\Var": "\\mathrm{Var}"
      #   "\\Cov": "\\mathrm{Cov}"

  # pdf:
  #   documentclass: scrreprt  # impaginazione da libro (KOMA-Script)
  #   classoption: [12pt, oneside]
  #   pdf-engine: xelatex
  #   pdf-engine-opt: "-shell-escape"
  #   number-sections: true
  #   toc: true
  #   toc-depth: 2
  #   fig-align: center
  #   fig-width: 6
  #   fig-height: 4
  #   keep-tex: true


execute:
  freeze: auto  # Skip re-executing unchanged code chunks
  echo: true  # Display code in the output document
  warning: false  # Suppress warnings in output
  message: false  # Suppress messages in output
  fig.width: 6  # Set figure width (in inches)
  fig.asp: 0.618  # Set figure aspect ratio (golden ratio for aesthetics)
  fig.retina: 2  # High resolution for retina displays
  fig.align: "center"  # Center-align all figures
  fig.show: "hold"  # Group multiple figures from a chunk
  options:
    width: 120            # allarga la console virtuale
    pillar.width: Inf      # disattiva il riassunto colonne
    tibble.width: Inf      # idem, per sicurezza

website:
  cookie-consent:
    type: express
    style: headline
    anonymize-ip: true

# Opzionale: assicurati che _common.R sia disponibile ovunque
resources:
  - _common.R
